[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Generic classic ESP32 / 4 MB flash build target, not a wiring diagram.
; Framework package is Arduino-ESP32 2.0.17; do not mix in 3.x LEDC APIs.
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212
